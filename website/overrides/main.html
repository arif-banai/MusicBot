{% extends "base.html" %}

{% block extrahead %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  {% set og_title = config.site_name if (not page or page.is_homepage) else page.title ~ " - " ~ config.site_name %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ og_title | striptags }}">
  <meta property="og:description" content="{{ (page.meta.description if page and page.meta and page.meta.description else config.site_description) | e }}">
  <meta property="og:image" content="{{ config.site_url }}assets/images/favicon.svg">
  {% if page and page.canonical_url %}<meta property="og:url" content="{{ page.canonical_url }}">{% endif %}
{% endblock %}
