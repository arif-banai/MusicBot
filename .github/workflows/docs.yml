name: Docs

# Builds and checks the docs website (website/) on PRs, and publishes master to GitHub Pages.
on:
  pull_request:
    branches: [master, 'release/**']
    paths: ['website/**', '.github/workflows/docs.yml', 'README.md', '.github/ISSUE_TEMPLATE/**']
  push:
    branches: [master]
    paths: ['website/**', '.github/workflows/docs.yml', 'README.md', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install docs toolchain
        run: pip install -r website/requirements.txt

      - name: Build and test (strict)
        working-directory: website
        run: python -m pytest -q

      - name: Upload built site for preview
        uses: actions/upload-artifact@v6
        with:
          name: docs-site
          path: website/site
          retention-days: 14

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
